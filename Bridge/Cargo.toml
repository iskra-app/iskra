[workspace]
resolver = "2"
members = [
    "crates/iskra-tunnel-proto",
    "crates/iskra-bridge",
    "crates/iskra-tunnel-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zhuravlevb/iskra"

[workspace.dependencies]
nostr-sdk = { version = "0.44", features = ["nip44"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
governor = "0.8"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
