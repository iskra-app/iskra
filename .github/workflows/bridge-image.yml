# The bridge as a ready-made image, so that raising one is `docker compose up -d` and not a Rust
# toolchain. ghcr.io/zhuravlevb/iskra-bridge:
#
#   latest   — main, the stable line
#   dev      — dev, whatever is newest
#   1.2.3    — a tag bridge-v1.2.3, and 1.2 alongside it
#
# amd64 and arm64 both: a VPS, and a Raspberry Pi or a NAS at home.
name: Bridge image

on:
  push:
    branches: [main, dev]
    tags: ["bridge-v*"]
    paths:
      - "Bridge/**"
      - ".github/workflows/bridge-image.yml"
  pull_request:
    paths:
      - "Bridge/**"
      - ".github/workflows/bridge-image.yml"
  workflow_dispatch:

concurrency:
  group: bridge-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/iskra-bridge

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bridge
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Bridge
      - run: cargo test --workspace --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=match,pattern=bridge-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=bridge-v(\d+\.\d+)\.\d+,group=1
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Iskra bridge
            org.opencontainers.image.description=Matrix over nostr, for the Iskra client
      - uses: docker/build-push-action@v6
        with:
          context: Bridge
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
