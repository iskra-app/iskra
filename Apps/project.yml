# Generated into Iskra.xcodeproj by XcodeGen: `cd Apps && xcodegen`.
#
# The .xcodeproj is not committed. It is a build artefact, and a famously
# merge-hostile one; this file is the thing to edit and review.
#
# Both app targets are deliberately thin. They own the bundle, the entitlements and
# (soon) the notification extension. All behaviour comes from the SwiftPM packages in
# the parent directory, which is what lets one codebase serve three platforms.
name: Iskra

options:
  bundleIdPrefix: wtf
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

packages:
  Iskra:
    path: ..
  # IskraCore is its own package so that it can be a dynamic framework: the app and both
  # extensions share one copy of the Rust SDK instead of carrying three (Core/Package.swift).
  IskraCore:
    path: ../Core

settings:
  base:
    DEVELOPMENT_TEAM: 936RH3UPR3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # The two numbers the settings screen shows.
    #
    # They only reach the app because every target below repeats them into its Info.plist as
    # $(MARKETING_VERSION) and $(CURRENT_PROJECT_VERSION). Leave those lines out and XcodeGen
    # does *not* fall back to these — it writes its own defaults, a literal "1.0" and "1", and
    # the build settings here are simply never read. The app then reports version 1.0 build 1
    # for ever, no matter what is changed here, which is exactly how this was found.
    MARKETING_VERSION: "0.3.0"
    # The version is written by hand; the build number is not. This value is only what a build
    # with no git repository to count falls back to — see the `Stamped` template below, which
    # overwrites it in the bundle with the number of commits.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    # The SDK is a large static library; without this, debug builds of the app can
    # spend minutes in the linker.
    DEAD_CODE_STRIPPING: YES

# Everything that ships gets its build number stamped, and all three bundles get the same one.
#
# The number is the count of commits, which is the one number about a build that nobody has to
# remember to increment and that always goes up. It cannot be a build *setting*, because a
# setting is a constant written at generate time and would be stale by the next commit — so it
# is written into the built Info.plist instead, on every build, after the file has been copied
# into the bundle and before it is signed.
#
# A build with no git — an exported source tree, a CI checkout of a tarball — leaves the plist
# alone and keeps CURRENT_PROJECT_VERSION. It is a build number, not a reason to fail a build.
#
# The extension is stamped for a harder reason than tidiness: iOS refuses to install an app
# whose embedded extension carries a different CFBundleVersion from its host. Stamping the app
# and not the extension would produce exactly that mismatch.
targetTemplates:
  Stamped:
    preBuildScripts:
      - name: Stamp the build number with the commit count and hash
        # It stamps the *source* Info.plist — the one XcodeGen wrote next to this file — and
        # not the built copy inside the bundle, which is the version of this that does not
        # work. A build phase is the last thing to run, after the app has already been signed,
        # so editing the bundle's plist there invalidates the signature it was just given:
        # "invalid Info.plist (plist or signature have been modified)", and the app will not
        # launch. Written here, before the plist is copied in, the number is signed along with
        # everything else.
        #
        # Editing a generated file is safe precisely because it is generated: these plists are
        # XcodeGen's output and are gitignored, and the next `xcodegen` puts the placeholder
        # back. There is nothing here to lose.
        #
        # Nothing about this script's output is a file Xcode can track, so left to work it out
        # for itself Xcode would run it once and skip it for ever after — freezing the build
        # number at whatever the count was that day.
        basedOnDependencyAnalysis: false
        # And declaring the plist an output is what *orders* this against the task that copies
        # it into the bundle. Without it the two are unrelated in the build graph and Xcode is
        # free to run them in either order: the first build after this was added stamped the
        # app with 49 and the extension with 1, in the same build, from the same script. Naming
        # the file the script writes — which is the file plist processing reads — gives the
        # build system the edge it needs to always run this first.
        outputFiles:
          - $(SRCROOT)/$(INFOPLIST_FILE)
        script: |
          set -euo pipefail
          commits=$(git -C "$SRCROOT/.." rev-list --count HEAD 2>/dev/null || true)
          [ -n "$commits" ] || exit 0
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $commits" "$SRCROOT/$INFOPLIST_FILE"
          # And which commit it was, for the About screen (`AppVersion.commit`): the count says
          # how far along a build is, only the hash says which tree it came from — two branches
          # reach the same count. Deleted first because `Set` fails on a key that is not there,
          # and XcodeGen's plist has no placeholder for this one.
          commit=$(git -C "$SRCROOT/.." rev-parse --short HEAD)
          /usr/libexec/PlistBuddy -c "Delete :IskraCommit" "$SRCROOT/$INFOPLIST_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :IskraCommit string $commit" "$SRCROOT/$INFOPLIST_FILE"

targets:
  Iskra (iOS):
    type: application
    platform: iOS
    templates: [Stamped]
    scheme: {}
    sources:
      - path: Shared
      # The privacy manifest App Store Connect refuses an upload without. The extensions carry
      # their own, in their own folders, each true of its own bundle.
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      # `type: file` matters: an .icon is a directory on disk, and without this XcodeGen
      # would walk into it and add its insides as loose files instead of handing the
      # bundle to actool whole.
      - path: ../icons/iskra-spark.icon
        type: file
        buildPhase: resources
      # The seven the icon can be changed to, on iPhone and iPad — see `HomeIcon` and
      # `HomeIconPicker`. Each is listed here with `type: file` for the same reason the one
      # above is.
      #
      # They ship on iOS only, and not out of tidiness: `setAlternateIconName` is
      # UIKit's, AppKit has no equivalent at all, and a Mac app's icon is the one in its
      # bundle. Listing them in the macOS target would embed seven icons nothing could
      # ever select.
      - path: ../icons/iskra-chrome.icon
        type: file
        buildPhase: resources
      - path: ../icons/iskra-garnet.icon
        type: file
        buildPhase: resources
      - path: ../icons/iskra-pine.icon
        type: file
        buildPhase: resources
      - path: ../icons/iskra-rio-de-janeiro.icon
        type: file
        buildPhase: resources
      - path: ../icons/iskra-black-white.icon
        type: file
        buildPhase: resources
      - path: ../icons/iskra-retro.icon
        type: file
        buildPhase: resources
      - path: ../icons/iskra-letters.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Iskra
        product: IskraFeatures
      # Embedded into the app, which is the only way an extension ships. It is not a
      # separate download and has no life of its own: iOS launches it, on its own, when a
      # push arrives — see Apps/NotificationService.
      - target: IskraNotificationService
      # And the share extension, embedded the same way: it is what puts Iskra in the system Share
      # sheet, and like any extension it ships inside its host.
      - target: IskraShareExtension
      # And the widgets: the favourites on the home screen and the two Live Activities.
      - target: IskraWidgets
    settings:
      base:
        PRODUCT_NAME: Iskra
        PRODUCT_BUNDLE_IDENTIFIER: wtf.iskra
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
        # ../icons/iskra-spark.icon, an Icon Composer document, named without its extension —
        # which is what actool expects. One icon serves both platforms: it carries its own
        # light, dark and tinted appearances, so there is no set of PNGs to keep in step.
        #
        # This has to be set on the *target*. XcodeGen gives every app target a default
        # of `AppIcon`, and a target setting beats the project-level one, so putting it
        # in the shared `settings.base` above looks right and silently loses.
        #
        # It was called `iskra` until iOS went on showing an *earlier* icon on notifications
        # long after the home screen had the new one — the bundle held nothing old (checked:
        # Assets.car and the legacy `CFBundleIconFiles` PNGs are both the current artwork), so
        # it was iOS's own cache, keyed on the icon's name. A new name is a new icon to it.
        # Rename it again the same way if the cache ever sticks again.
        ASSETCATALOG_COMPILER_APPICON_NAME: iskra-spark
        # The seven the app can be changed to. Named the same way — without the extension —
        # and this is the whole of what makes `setAlternateIconName` able to find them:
        # an icon listed in `sources` is merely compiled, and an icon named here is
        # *registered*, which is a different thing and the one that matters.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: iskra-chrome iskra-garnet iskra-pine iskra-rio-de-janeiro iskra-black-white iskra-retro iskra-letters
        # And this is what keeps their artwork in the bundle. Without it actool ships only
        # the icon the app launches with, and every alternate resolves to nothing: the
        # call succeeds, the icon does not change, and there is nothing in any log.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Which APNs the device token lives in — see `aps-environment` below. Development for
        # everything built to run here (`run.sh` and `device.sh` both build Debug), production
        # for the archive that goes to TestFlight and the App Store. It has to follow the build
        # configuration, because `PushRegistration.appID` does (`#if DEBUG` → the gateway's
        # sandbox entry, otherwise production): a production build with a sandbox entitlement
        # is a token Sygnal sends into the wrong APNs, and every push silently goes nowhere.
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    entitlements:
      path: iOS/Iskra.entitlements
      properties:
        # Both shared with the notification extension, which runs in its own process
        # and must open the same encrypted store and read the same session to decrypt
        # a push on device.
        #
        # These are two different identifiers, and they have to be. A Team Provisioning
        # Profile allows keychain-access-groups = ["936RH3UPR3.*"], and an App Group ID
        # does not match that wildcard — Xcode fails the build with "profile doesn't
        # match the entitlements file's value for the keychain-access-groups
        # entitlement". So the Keychain group takes the team prefix, which Xcode
        # expands here and AppEnvironment reads back out of the Info.plist.
        #
        # The App Group must also be enabled on the App ID, or the profile carries no
        # application-groups and the container is refused on device. The Simulator
        # ignores provisioning and will happily hide that from you.
        com.apple.security.application-groups: [group.wtf.iskra]
        keychain-access-groups: [$(AppIdentifierPrefix)wtf.iskra.shared]
        aps-environment: $(APS_ENVIRONMENT)
        # What makes a message from a person look like a message from a person: their avatar in
        # a circle, their name where the app's name would be, a place of their own in
        # Notification Summary, and a way past a Focus that is letting people through. See
        # `CommunicationNotification`.
        #
        # Unlike everything else in this file, Xcode cannot add this one to a Team Provisioning
        # Profile on its own: "Communication Notifications" has to be enabled on **both** App IDs
        # at developer.apple.com first — `wtf.iskra` and
        # `wtf.iskra.notifications`. Without that the build fails outright, with
        # "Provisioning profile … doesn't include the Communication Notifications capability",
        # which is a clear enough sentence to recognise if this ever moves to another account.
        com.apple.developer.usernotifications.communication: true

    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Iskra
        # Both are what `AppVersion` reads, and both must be written as build-setting
        # references — see the note on MARKETING_VERSION above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, de, es, fr, ja, zh-Hans]
        # An empty UILaunchScreen is what tells iOS the app is built for modern
        # displays. Without it the app is letterboxed into a legacy-sized box with
        # black bars, and the process shows up as "rb-legacy". Empty is correct here:
        # it means "plain background", and the sign-in screen appears immediately.
        UILaunchScreen: {}
        # The iPhone list leaves out upside-down, as iPhone apps do. The iPad needs all four, and
        # needs them in a key of its own: an app that supports iPad multitasking and lists fewer
        # is refused at upload — "Invalid bundle … you need to include all of the … orientations"
        # — which nothing before App Store Connect checks, so every local build looks fine.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Written in the first person, because that is who is being asked.
        NSCameraUsageDescription: Iskra uses the camera so you can record video messages, take photos to send and scan QR codes.
        NSMicrophoneUsageDescription: Iskra uses the microphone so you can record voice messages.
        # There is deliberately no NSPhotoLibraryUsageDescription, and its absence is the point.
        #
        # That key asks for read access to the *entire* photo library, and this app has never needed
        # it: pictures are chosen through `PhotosPicker`, which runs out of process and hands back
        # only what the user picked. It requires no permission at all — that is the whole reason it
        # exists. Declaring the key anyway bought nothing and licensed everything, and iOS is
        # entitled to show the prompt for it: a messenger asking to see all your photographs, in
        # order to do something it can already do without asking.
        #
        # What remains is add-only, below, which is a different and much narrower thing.
        #
        # Saving a photo out of a conversation. "Add only" lets the app put a picture in the library
        # and gives it no way to look at what is already there.
        NSPhotoLibraryAddUsageDescription: Iskra needs permission to save a photo or a video from a chat to your library.
        # Only ever asked when the "my location" button on the map is pressed — never on opening
        # the picker. Somebody sending a pin from a map of a city they are not in should not have
        # to say where they are to do it. A pin is one coordinate, once, to point a map at; a live
        # share is the person's position for as long as they chose, and stops by itself.
        NSLocationWhenInUseUsageDescription: Iskra uses your location only when you ask it to — to put a map on the place you are, or to share where you are with a chat for as long as you choose.
        # "Transcribe" on a voice message. Recognition is on the device only
        # (`requiresOnDeviceRecognition`, see `VoiceTranscriber`) — the recording never goes to Apple.
        NSSpeechRecognitionUsageDescription: Iskra turns a voice message into text when you ask it to, on this device — the recording is never sent anywhere.
        # Face ID, for the app lock. Load-bearing: LocalAuthentication traps the moment it evaluates a
        # Face ID policy without this key present, so the crash lands on the first unlock rather than
        # anywhere near the setting that turned the lock on. Touch ID and the passcode do not need it;
        # Face ID does, and the same `.deviceOwnerAuthentication` call can reach for either.
        NSFaceIDUsageDescription: Iskra uses Face ID to unlock the app.
        # Required of any app holding `com.apple.developer.usernotifications.communication`, and
        # the absence of it does not look like an absence: the entitlement is granted, the code
        # runs, `updating(from:)` throws "intent is not supported", the throw is caught, and the
        # notification appears in its ordinary form with the app's icon on it. Nothing anywhere
        # says a key is missing. (App Store Connect does say so, eventually, as ITMS-90894 — which
        # is a slow way to find out.)
        NSUserActivityTypes: [INSendMessageIntent]
        # ASWebAuthenticationSession intercepts the sign-in callback itself, but the
        # scheme is registered so the OAuth provider can hand it back to us.
        CFBundleURLTypes:
          # Reverse-DNS of the client's domain (iskra.wtf), which is the only scheme a
          # homeserver running the authentication service will accept — and the same string as
          # AppEnvironment.oauthRedirectURI, which it has to be.
          - CFBundleURLName: wtf.iskra.oauth
            CFBundleURLSchemes: [wtf.iskra]
          # The spec's own scheme for people and rooms (MSC2312): `matrix:u/boris:matrix.org`.
          # Claimed so that a `matrix:` link anywhere on the device — a web page, a note, another
          # app — opens here. `matrix.to` links cannot be claimed this way, and that is not an
          # omission: a domain's links go to an app only if the domain itself names the app, and
          # matrix.to is not ours. See `MatrixLink`.
          - CFBundleURLName: wtf.iskra.matrix
            CFBundleURLSchemes: [matrix]
        # `location`: a live location share goes on while the phone is in a pocket, which is the
        # whole of what it is for — see `LiveLocationSharer`. The system shows the blue pill for as
        # long as it runs, so nobody's position leaves the phone without their seeing it. Only ever
        # used while a share is on; nothing else in the app asks for location in the background.
        UIBackgroundModes: [remote-notification, location]
        # The live location share and a long upload, on the lock screen and in the Dynamic Island —
        # see `LiveLocationActivity` and `MediaSendBackground`. Drawn by Apps/Widgets.
        NSSupportsLiveActivities: true
        # A video or an album that keeps going after the app is put away: iOS 26's
        # `BGContinuedProcessingTask`, one identifier per upload under this prefix. Without the
        # entry `register` answers no, and the upload falls back to half a minute of
        # `beginBackgroundTask` — see `MediaSendBackground`.
        BGTaskSchedulerPermittedIdentifiers: [wtf.iskra.upload.*]

  # The process that decrypts a push. iOS wakes it when one arrives, gives it ~30 seconds,
  # and shows whatever it puts on screen — see Apps/NotificationService/NotificationService.swift.
  #
  # iOS only, deliberately. `aps-environment` is on the iOS app and not the Mac one, and a
  # Mac that is awake has the app itself to notice a message. Nothing here would stop a
  # macOS extension later; there is just nothing yet for it to do.
  IskraNotificationService:
    type: app-extension
    platform: iOS
    templates: [Stamped]
    sources:
      - path: NotificationService
      # Compiled into the app as well, which is the point of it: the app's `--probe-notification`
      # has to say what this process will actually draw, and a second copy of that decision is a
      # probe that can be wrong about the one thing it is for.
      - path: Shared/PushFace.swift
    dependencies:
      # IskraCore, not IskraFeatures. The extension has no screens and must not link any:
      # it is memory-limited (24 MB), and dragging SwiftUI and every view in the app into a
      # process that exists to write two lines of text is how an extension gets killed
      # before it decrypts anything.
      - package: IskraCore
        product: IskraCore
      # And IskraDesign, which is not the same concession. It has no dependencies at all — not
      # the Rust SDK, not IskraFeatures — and it is linked for exactly one symbol:
      # `BlobatarImage`, which draws the face of a sender who has no picture. Without it a push
      # from such a person arrives with an empty circle while the chat list shows a creature, and
      # nothing in the app can put the same face on the lock screen, because the code that knows
      # what the face looks like would be in the other process.
      #
      # It draws with Core Graphics and never calls into SwiftUI at runtime, so the cost here is
      # a link, not a view hierarchy.
      - package: Iskra
        product: IskraDesign
    settings:
      base:
        PRODUCT_NAME: IskraNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: wtf.iskra.notifications
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Iskra
        # The extension is embedded in the app, and iOS refuses to install a bundle whose
        # embedded extension carries a different version from its host — so these are not
        # decoration here, they are what keeps the two in step.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, de, es, fr, ja, zh-Hans]
        # Load-bearing, and the single easiest thing here to leave out.
        #
        # `AppEnvironment.keychainAccessGroup` reads this key out of `Bundle.main` to build
        # the Keychain group — and inside an extension `Bundle.main` is the *extension's*
        # bundle, not the app's. Without this line the prefix comes back empty, the group
        # silently becomes "wtf.iskra.shared" with no team ID in front of it, the
        # Keychain returns nothing, and the extension reports "nobody is signed in" on a
        # device where somebody plainly is.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          # The other half of the same requirement. The app declares that it handles the intent;
          # the extension declares that it *sends* one — and it is the extension that calls
          # `updating(from:)`, so without this line the app's declaration alone changes nothing.
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/Iskra.entitlements
      properties:
        # The same two groups as the app, and this is the entire point of the exercise: the
        # extension is a different process with a different bundle ID, and it is granted
        # these separately. It opens the app's encrypted SQLite store and reads the app's
        # session out of the app's Keychain group — and if either grant is missing, that is
        # where it fails. `Iskra --probe-notification` is what says so out loud.
        com.apple.security.application-groups: [group.wtf.iskra]
        keychain-access-groups: [$(AppIdentifierPrefix)wtf.iskra.shared]
        # Granted here too, and this is the copy that does the work: the intent is donated and
        # the notification rewritten in *this* process. The app's own grant matters so that the
        # App ID carries the capability at all.
        com.apple.developer.usernotifications.communication: true

  # The Share sheet target: what lets another app hand text, a link, photos, videos or files to a
  # specific Iskra chat.
  #
  # Unlike the notification extension it *does* have a screen — a room picker — so it links SwiftUI,
  # but still only IskraCore, never IskraFeatures: it needs the shared chat directory and the App
  # Group, not the whole app. It writes the shared thing to the App-Group outbox and Iskra sends it
  # the next time it comes up — the same outbox the App Intents use. iOS only, where the Share sheet
  # and the App Group entitlement live.
  IskraShareExtension:
    type: app-extension
    platform: iOS
    templates: [Stamped]
    sources:
      - path: ShareExtension
    dependencies:
      - package: IskraCore
        product: IskraCore
      # For the share sheet's grid of faces (`ShareTargetGrid`, `BlobatarView`). Not a concession for
      # the same reason the notification extension's is not: the target has no dependencies at all.
      - package: Iskra
        product: IskraDesign
    settings:
      base:
        PRODUCT_NAME: IskraShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: wtf.iskra.share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Iskra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, de, es, fr, ja, zh-Hans]
        # Load-bearing for the same reason as in the notification extension: `Bundle.main` here is
        # this extension's bundle, and `AppEnvironment.keychainAccessGroup` reads the prefix out of it.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          # Offered for text, links, photos, videos and files. The files are copied into the App
          # Group's outbox folder and the app sends them through its own encrypted upload — see
          # `ShareViewController`. Ten of each is a share sheet's worth; a hundred photos would be
          # a hundred copies in a process with a small allowance.
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: ShareExtension/Iskra.entitlements
      properties:
        com.apple.security.application-groups: [group.wtf.iskra]
        # No keychain-access-groups, on purpose. This process parses whatever another app hands
        # it and never reads a secret; it has no business holding the group with the tokens and
        # the store passphrases in it.

  # The widgets: the favourites on the home screen, and how the two Live Activities look. The app
  # starts and moves the activities; their look lives here because the system says it must.
  #
  # Linked like the share extension — IskraCore and IskraDesign, never IskraFeatures — and granted
  # the App Group but not the Keychain group: it reads names and pictures the app left in the
  # container, and nobody's tokens.
  #
  # `ChatEntity.swift` and `WidgetIntents.swift` are compiled into the app as well (it takes all of
  # Shared). A widget's configuration and its buttons are intents, and the system matches them
  # across the two bundles by type — a copy of its own here would be a different type, and every
  # chat somebody picked would fail to resolve in the app, which is where `perform` runs.
  IskraWidgets:
    type: app-extension
    platform: iOS
    templates: [Stamped]
    sources:
      - path: Widgets
      - path: Shared/ChatEntity.swift
      - path: Shared/WidgetIntents.swift
      # The intents' words — "Choose Chats", "Stop Sharing Location" — are looked up in the bundle
      # the intent is drawn from, which for the widget's settings is this one.
      - path: Shared
        includes: ["*.lproj/Localizable.strings"]
        buildPhase: resources
    dependencies:
      - package: IskraCore
        product: IskraCore
      - package: Iskra
        product: IskraDesign
    settings:
      base:
        PRODUCT_NAME: IskraWidgets
        PRODUCT_BUNDLE_IDENTIFIER: wtf.iskra.widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Iskra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, de, es, fr, ja, zh-Hans]
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Iskra.entitlements
      properties:
        com.apple.security.application-groups: [group.wtf.iskra]
        # No keychain-access-groups, for the share extension's reason: it never reads a secret.

  Iskra (macOS):
    type: application
    platform: macOS
    templates: [Stamped]
    sources:
      - path: Shared
      - path: ../icons/iskra-spark.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Iskra
        product: IskraFeatures
    settings:
      base:
        PRODUCT_NAME: Iskra
        PRODUCT_BUNDLE_IDENTIFIER: wtf.iskra
        # The same icon as iOS, and set on the target for the same reason. See above.
        ASSETCATALOG_COMPILER_APPICON_NAME: iskra-spark
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Iskra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, de, es, fr, ja, zh-Hans]
        LSMinimumSystemVersion: "15.0"
        NSCameraUsageDescription: Iskra uses the camera so you can record video messages and scan QR codes.
        NSMicrophoneUsageDescription: Iskra uses the microphone so you can record voice messages.
        NSLocationWhenInUseUsageDescription: Iskra uses your location only when you ask it to — to put a map on the place you are, or to share where you are with a chat for as long as you choose.
        # "Transcribe" on a voice message. Recognition is on the device only
        # (`requiresOnDeviceRecognition`, see `VoiceTranscriber`) — the recording never goes to Apple.
        NSSpeechRecognitionUsageDescription: Iskra turns a voice message into text when you ask it to, on this device — the recording is never sent anywhere.
        CFBundleURLTypes:
          # Reverse-DNS of the client's domain (iskra.wtf), which is the only scheme a
          # homeserver running the authentication service will accept — and the same string as
          # AppEnvironment.oauthRedirectURI, which it has to be.
          - CFBundleURLName: wtf.iskra.oauth
            CFBundleURLSchemes: [wtf.iskra]
          # The spec's own scheme for people and rooms (MSC2312): `matrix:u/boris:matrix.org`.
          # Claimed so that a `matrix:` link anywhere on the device — a web page, a note, another
          # app — opens here. `matrix.to` links cannot be claimed this way, and that is not an
          # omission: a domain's links go to an app only if the domain itself names the app, and
          # matrix.to is not ours. See `MatrixLink`.
          - CFBundleURLName: wtf.iskra.matrix
            CFBundleURLSchemes: [matrix]
    entitlements:
      path: macOS/Iskra.entitlements
      properties:
        # Sandboxed, as any Mac app that talks to the network should be. The sandbox
        # also gives the app an implicit keychain access group, which is what lets the
        # data-protection keychain work on macOS.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        # Read-only, and only when the user picks a file to send.
        com.apple.security.files.user-selected.read-only: true
        # The sandbox refuses `CLLocationManager` outright without this — the "my location"
        # button on the map picker would return nothing at all, with no prompt and no error.
        com.apple.security.personal-information.location: true
        # The same group as iOS. On macOS an *unregistered* group would have to be
        # prefixed with the Team ID instead; registering it lets one identifier serve
        # both platforms.
        com.apple.security.application-groups: [group.wtf.iskra]
        keychain-access-groups: [$(AppIdentifierPrefix)wtf.iskra.shared]
